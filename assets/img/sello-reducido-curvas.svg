<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"
     role="img" aria-label="Sello de capotte, Bogotá">
  <title>capotte · bogota — sello, en curvas reducido</title>
  <!-- MAESTRO DE IMPRENTA. Las dos palabras van en CURVAS, no como texto
       vivo: este archivo no depende de que el taller tenga la fuente.
       Convertido con fonttools desde Gambetta Regular e Instrument Sans,
       y cotejado contra el render del maestro de pantalla: misma caja de
       tinta en los cuatro lados y misma masa dentro del 1 %.
       ⚠ Aquí el texto ya NO se puede editar. Para cambiar una palabra se
       edita el maestro de pantalla y se vuelve a convertir.
       Tamaño mínimo medido: 54 px. Por debajo, usar nada: por debajo de 54 px no sirve ninguno de los dos. -->
  <!-- El festón es un radio que ondula con RITMO —trece lóbulos— más un
       temblor mínimo. El ritmo es lo que lo hace un sello; el temblor, lo
       que evita que parezca troquelado a máquina. El trazado está congelado:
       un logotipo no se genera en cada carga, se guarda. -->
  <!-- La segunda escala óptica: sin lámina, con el filete más grueso. Es la
       que aguanta de 54 a 120 px. Por debajo de 54 no sirve ninguna de las
       dos — ahí hace falta una tercera pieza. -->
