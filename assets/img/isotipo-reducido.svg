<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 20 96 60" role="img" aria-label="Isotipo recreo, version reducida">
  <title>recreo — isotipo reducido</title>
  <!-- Mismo dibujo, otro tamano optico: el trazo engorda y el punto crece
       para que a 16 y 32 px los tres elementos no se empasten.
       Usar de 40 px hacia abajo (favicon, bordado, grabado). -->
  <g fill="none" stroke="#0B0B0C" stroke-width="11" stroke-linecap="round">
    <path d="M34 26 A26 26 0 0 0 34 74"/>
    <path d="M66 26 A26 26 0 0 1 66 74"/>
  </g>
  <circle cx="50" cy="50" r="11" fill="#0B0B0C"/>
</svg>
