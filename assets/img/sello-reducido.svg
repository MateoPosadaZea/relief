<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"
     role="img" aria-label="Sello de capotte, Bogotá">
  <title>capotte · bogota — sello reducido</title>
  <!-- El festón es un radio que ondula con RITMO —trece lóbulos— más un
       temblor mínimo. El ritmo es lo que lo hace un sello; el temblor, lo
       que evita que parezca troquelado a máquina. El trazado está congelado:
       un logotipo no se genera en cada carga, se guarda. -->
  <!-- La segunda escala óptica: sin lámina, con el filete más grueso. Es la
       que aguanta de 54 a 120 px. Por debajo de 54 no sirve ninguna de las
       dos — ahí hace falta una tercera pieza. -->
